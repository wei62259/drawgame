<style>
/* 版面概念：一座深夜的宮廟。上半是排隊的紙紮信眾，下半是供桌，桌上一張黃符紙、一爐當計時器的香。 */
:root {
  color-scheme: dark;
  --wall: #6e1a12;
  --wall-deep: #3f0f0b;
  --desk: #38190e;
  --desk-edge: #5b2c16;
  --gold: #e0b24a;
  --gold-soft: #f3d98f;
  --talisman: #f0c93e;
  --cinnabar: #b81f12;
  --cream: #fff6dc;
  --ink: #2d1610;
  --ember: #ff7a2e;
  --display: "Cactus Classical Serif", "BiauKai", "Kaiti TC", "DFKai-SB", serif;
  --body: "LXGW WenKai TC", "Kaiti TC", "BiauKai", "DFKai-SB", serif;
}
html, body { height: 100%; }
body {
  background: var(--wall-deep);
  color: var(--cream);
  font-family: var(--body);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
.game {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100%;
  max-width: 480px;
  margin-inline: auto;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  background: var(--desk);
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--gold-soft); outline-offset: 2px; }

/* 廟內場景 */
.stage {
  position: relative;
  flex: 0 0 clamp(190px, 36%, 320px);
  overflow: hidden;
  background:
    radial-gradient(circle at 12% 12%, rgba(255, 170, 70, .3), transparent 26%),
    radial-gradient(circle at 88% 12%, rgba(255, 170, 70, .3), transparent 26%),
    linear-gradient(180deg, var(--wall), var(--wall-deep));
}
.plaque {
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  padding: 3px 12px 4px;
  font-family: var(--display);
  font-size: clamp(15px, 4.6vw, 20px);
  letter-spacing: .14em;
  white-space: nowrap;
  color: var(--gold);
  background: #1f0d08;
  border: 2px solid var(--gold);
  outline: 1px solid #1f0d08;
}
.hud { position: absolute; top: 6px; z-index: 8; font-variant-numeric: tabular-nums; line-height: 1.05; }
.hud b { font-family: var(--display); font-weight: 400; font-size: 30px; }
.hud span { font-size: 13px; margin-left: 2px; }
.hud small { display: block; font-size: 12px; color: var(--gold-soft); }
.hud-time { left: 10px; }
.hud-score { right: 10px; text-align: right; }
.urgent .hud-time { color: #ffb37d; animation: pulse .5s ease-in-out infinite alternate; }
@keyframes pulse { to { transform: scale(1.12); } }

/* 排隊的紙紮人 */
.queue { position: absolute; inset: 0; }
.person {
  position: absolute;
  bottom: 0;
  transform-origin: 50% 100%;
  transition: right .25s ease-out, height .25s ease-out, filter .25s, opacity .25s, transform .26s ease-in;
}
.person[data-slot="0"] { right: 0; height: 80%; z-index: 5; }
.person[data-slot="1"] { right: 33%; height: 66%; z-index: 4; filter: brightness(.74); }
.person[data-slot="2"] { right: 50%; height: 58%; z-index: 3; filter: brightness(.62); }
.person[data-slot="3"] { right: 63%; height: 52%; z-index: 2; filter: brightness(.52); }
.person[data-slot="4"] { right: 74%; height: 46%; z-index: 1; filter: brightness(.44); }
.person.leaving { transform: translateX(60%) rotate(9deg); opacity: 0; z-index: 6; }

/* 對話框 */
.bubble {
  position: absolute;
  z-index: 7;
  left: 8px;
  top: 46px;
  width: 56%;
  padding: 7px 10px 8px;
  background: var(--cream);
  color: var(--ink);
  border-radius: 4px;
  box-shadow: 0 3px 0 rgba(0, 0, 0, .35);
  font-size: clamp(14px, 3.9vw, 16px);
  line-height: 1.32;
}
.bubble::after {
  content: "";
  position: absolute;
  right: -9px;
  top: 22px;
  border-left: 10px solid var(--cream);
  border-top: 7px solid transparent;
  border-bottom: 7px solid transparent;
}
.bubble p { margin: 0; }
.who { font-size: 12px; color: #7d4a2c; }
.rule { margin-top: 4px !important; padding: 2px 6px; background: var(--cinnabar); color: var(--cream); font-size: 13px; line-height: 1.25; font-weight: 700; }
.say {
  position: absolute;
  z-index: 9;
  right: 8px;
  bottom: 12px;
  max-width: 70%;
  padding: 4px 9px;
  background: var(--gold-soft);
  color: var(--ink);
  font-size: 14px;
  font-weight: 700;
  line-height: 1.25;
  opacity: 0;
  pointer-events: none;
  box-shadow: 0 2px 0 rgba(0, 0, 0, .35);
}
.say.show { animation: rise 1.25s ease-out; }
.say.bad { background: #f6c0ad; }
@keyframes rise {
  0% { opacity: 0; transform: translateY(10px); }
  12%, 75% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-14px); }
}

/* 供桌 */
.altar {
  position: relative;
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  border-top: 5px solid var(--desk-edge);
  background: repeating-linear-gradient(92deg, #3e1c10 0 3px, #38190e 3px 11px, #341609 11px 17px);
}
.desk { flex: 1 1 0; min-height: 0; display: flex; gap: 6px; padding: 10px 6px 4px; }
.burner, .inkstone { position: relative; flex: 0 0 44px; }
.sheet-slot { flex: 1 1 0; min-width: 0; container-type: size; display: flex; align-items: center; justify-content: center; }
.sheet {
  position: relative;
  width: min(100cqw, 75cqh);
  aspect-ratio: 3 / 4;
  box-shadow: 0 5px 12px rgba(0, 0, 0, .5);
  touch-action: none;
  transition: transform .15s ease-out, opacity .15s;
  will-change: transform;
}
.sheet canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#ink { touch-action: none; cursor: crosshair; }
.stamp { width: 26% !important; height: auto !important; inset: auto 6% 5% auto !important; aspect-ratio: 1; opacity: 0; pointer-events: none; }
.sheet.sending { transition: transform .28s cubic-bezier(.3, .7, .3, 1), opacity .28s .1s; opacity: .85; }
.sheet.sending .stamp { opacity: 1; animation: stampIn .13s ease-out; }
.sheet.arriving { animation: arrive .2s ease-out; }
.sheet.shake { animation: shake .3s linear; }
@keyframes stampIn { from { transform: scale(2.2) rotate(-6deg); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes arrive { from { transform: translateY(26%) rotate(1.5deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }

/* 香爐：就是計時器 */
.stick {
  position: absolute;
  left: 50%;
  bottom: 30px;
  width: 4px;
  margin-left: -2px;
  height: calc((100% - 38px) * var(--burn, 1));
  background: #a5602f;
}
.stick::before {
  content: "";
  position: absolute;
  top: -4px;
  left: -1px;
  width: 6px;
  height: 7px;
  border-radius: 3px;
  background: var(--ember);
  box-shadow: 0 0 9px 3px rgba(255, 122, 46, .75);
}
.urgent .stick::before { box-shadow: 0 0 16px 7px rgba(255, 122, 46, .95); }
.pot {
  position: absolute;
  left: 3px;
  right: 3px;
  bottom: 2px;
  height: 32px;
  background: linear-gradient(90deg, #7a5a1f, var(--gold) 45%, #6c4d18);
  border-radius: 3px 3px 15px 15px;
}
.pot::before { content: ""; position: absolute; left: -3px; right: -3px; top: -3px; height: 7px; border-radius: 3px; background: var(--gold-soft); }
.burn-label { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-family: var(--display); font-size: 13px; color: #3a2708; }
.inkstone svg { position: absolute; left: 0; bottom: 2px; width: 44px; height: auto; }

/* 開壇控制列與交符把手 */
.controls { flex: 0 0 auto; display: flex; flex-direction: column; gap: 5px; padding: 3px 8px 8px; }
.ctl-row { display: flex; gap: 6px; align-items: stretch; }
.btn {
  min-height: 46px;
  padding: 4px 8px;
  border: 1px solid var(--gold);
  background: #1f0d08;
  color: var(--gold-soft);
  font-size: 14px;
  line-height: 1.15;
  border-radius: 3px;
}
.btn.primary { flex: 1 1 auto; background: var(--gold); color: #2a1404; border-color: var(--gold-soft); font-family: var(--display); font-size: 21px; letter-spacing: .2em; }
.btn:hover { filter: brightness(1.12); }
.btn:disabled { opacity: .5; cursor: default; filter: none; }
.note { margin: 0; text-align: center; font-size: 12px; color: var(--gold-soft); }
.handle {
  flex: 0 0 56px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  border: 0;
  background: transparent;
  color: var(--gold-soft);
  font-size: 14px;
  touch-action: none;
  opacity: .35;
  cursor: grab;
  transition: opacity .15s;
}
.handle.ready { opacity: 1; }
.handle svg { width: 26px; height: 16px; }
.handle.ready svg { animation: nudge .9s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateY(-4px); } }
.game[data-state="idle"] .handle { display: none; }
.game:not([data-state="idle"]) .controls { display: none; }
.game[data-state="idle"] #ink { cursor: default; pointer-events: none; }

/* 結算 */
.game[data-state="result"] .stage, .game[data-state="result"] .altar { display: none; }
.result { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; background: var(--wall-deep); user-select: text; -webkit-user-select: text; }
.result-scroll { flex: 1 1 0; min-height: 0; overflow-y: auto; touch-action: pan-y; }
.result-scroll img, .result-scroll canvas { display: block; width: 100%; height: auto; }
.result-actions { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0 10px; }
.result-actions .btn { flex: 1 1 88px; }
.status { flex: 1 0 100%; margin: 0; min-height: 1.2em; text-align: center; font-size: 13px; color: var(--gold-soft); user-select: text; -webkit-user-select: text; }

@media (prefers-reduced-motion: reduce) {
  .person, .sheet, .say.show, .handle.ready svg, .urgent .hud-time, .sheet.sending .stamp, .sheet.arriving, .sheet.shake { transition: none; animation-duration: .01s; }
  .handle.ready svg, .urgent .hud-time { animation: none; }
}
</style>

</main>

  /* ---------- 聲音 ---------- */
  let soundOn = true, ac = null, brushGain = null;

    knock() { tone(470, .09, .28); tone(235, .12, .16, 'triangle'); },           // 木魚
    stamp() { tone(120, .1, .4, 'triangle'); },
    good() { tone(988, .5, .1); tone(1319, .6, .08, 'sine', .08); },
    bad() { tone(165, .24, .18, 'sawtooth'); },
    end() { tone(523, 2.4, .2); tone(1046, 1.6, .07); },

  /* ---------- 遊戲狀態 ---------- */

  let deadline = 0, frame = 0, sending = false, lastKnock = 99, round = 0;
  let gesture = null, ink = 0, strokes = 0, box = null, paperStart = 0;
  let best = 0;
  try { best = Math.min(MAX_FANS, Math.max(0, Number(localStorage.getItem('jiji-ruling-best')) || 0)); } catch {}
  const pending = new Set();
  const later = (fn, ms) => { const id = setTimeout(() => { pending.delete(id); fn(); }, ms); pending.add(id); };
  const clearPending = () => { pending.forEach(clearTimeout); pending.clear(); };
  const fmtMoney = n => 'NT$' + n.toLocaleString('en-US');

  function setState(next) { state = next; game.dataset.state = next; }
  function setBurn(f) { $('burner').style.setProperty('--burn', String(Math.max(0, Math.min(1, f)))); }
  function showBest() {
    $('best-note').textContent = best > 0
      ? `本壇最高紀錄 ${best} 張。符咒僅供娛樂，考試還是要讀書。`
      : '本壇符咒僅供娛樂，考試還是要讀書。';
  }
  function setBubble(who, ask, rule) {
    $('who').textContent = who; $('ask').textContent = ask;
    $('rule').hidden = !rule;
    if (rule) $('rule').textContent = rule;
  }
  function say(text, bad) {
    const el = $('say');
    el.textContent = text;
    el.classList.remove('show', 'bad'); void el.offsetWidth;
    el.classList.add('show');
    el.classList.toggle('bad', !!bad);
  }

  /* 排隊 */
  function addPerson(slot) {
    if (serial >= order.length) return;
    const cust = order[serial++];
    const el = makePersonCanvas(cust.look);
    el.className = 'person'; el.dataset.slot = slot; el.setAttribute('aria-hidden', 'true');
    $('queue').append(el);
    cust.el = el;
  }
  function fillQueue() {

  }
  function advanceQueue() {
    const people = [...$('queue').children].filter(el => !el.classList.contains('leaving'));
    const first = people.shift();
    if (first) { first.classList.add('leaving'); later(() => first.remove(), 300); }
    people.forEach((el, i) => { el.dataset.slot = i; });
    addPerson(people.length);
  }
  function showCurrent() {
    const cust = order[count];
    if (!cust) return;
    setBubble(cust.name, cust.ask, cust.rule ? '指定：' + RULES[cust.rule].label + '｜靈驗香油錢 ×3' : '');
  }

  /* 開壇 */

    ctx.clearRect(0, 0, SW, SH);

  }
  function start() {
    ensureAudio(); sfx.bell();
    clearPending(); cancelAnimationFrame(frame);
    round++;
    order = buildOrder(); count = 0; money = 0; records = []; sending = false; lastKnock = 99;
    $('count').textContent = '0'; $('money').textContent = fmtMoney(0);
    $('time').textContent = String(duration / 1000); setBurn(1);
    game.classList.remove('urgent');
    $('result').hidden = true;

    sheet.className = 'sheet arriving'; sheet.style.transform = '';

  }
  function tick() {
    if (state !== 'playing') return;

    $('time').textContent = allDone ? $('time').textContent : '0';

  }

  function rankOf(n) {
    if (n === 0) return '還在找筆的道士';

    if (n < 10) return '廟口實習生';

    if (n < MAX_FANS) return '開壇大法師';

  }
  function collapse(recs) {
    const n = recs.length;
    if (n === 0) return {index:null, line:'香燒完了，一張符都沒畫。祖師爺沉默了。'};
    if (n < 4) return {index:null, line:'符太少，祖師爺還看不出你的本性。'};
    const k = Math.min(3, Math.floor(n / 2));
    const mean = list => list.reduce((a, r) => a + r.ink, 0) / list.length;
    const early = mean(recs.slice(0, k)), late = mean(recs.slice(-k));
    const index = Math.max(0, Math.min(99, Math.round((1 - late / early) * 100)));
    const breakAt = recs.findIndex((r, i) => i >= k && r.ink < early * .5);
    let line;
    if (index < 20) line = '每張都畫得很認真，排在後面的人也看得很認真。';
    else if (index < 70) line = breakAt >= 0 ? `從第 ${breakAt + 1} 張開始，你的手已經比信仰快了。` : '畫到後面，你開始相信心誠則靈。';
    else line = '最後幾張已經不是符了，是簽到。';
    return {index, line};
  }
  function wrapLines(c, text, maxW, maxLines) {
    const lines = [];
    let cur = '';
    for (const ch of text) {
      if (c.measureText(cur + ch).width > maxW && cur) {
        lines.push(cur); cur = ch;
        if (lines.length === maxLines) return lines;
      } else cur += ch;
    }
    if (cur) lines.push(cur);
    return lines;
  }
  function shareText() {
    return `我在一炷香內畫了 ${count} 張符，收了 ${fmtMoney(money)} 香油錢。稱號：${rankOf(count)}。\n#急急如律令`;
  }

  let resultBlob = null;
  async function showResult() {
    const myRound = round;
    setState('result');
    $('result').hidden = false;
    $('status').textContent = '';
    ['again', 'save', 'copy'].forEach(id => { $(id).disabled = true; });
    resultBlob = null;
    try { await document.fonts.ready; } catch {}

    const n = records.length;
    const W = 1200, pad = 36, gap = 24;
    const cols = n <= 4 ? 2 : n <= 9 ? 3 : 4;
    const cw = (W - pad * 2 - gap * (cols - 1)) / cols, ch = cw * 4 / 3;
    const capH = Math.round(cw * .34);
    const rows = Math.max(0, Math.ceil(n / cols));
    const headH = 330;
    const cv = document.createElement('canvas');
    cv.width = W;
    cv.height = headH + rows * (ch + capH + gap) + 90;
    cv.setAttribute('role', 'img');
    cv.setAttribute('aria-label', `今日符咒一覽，共 ${n} 張，香油錢 ${fmtMoney(money)}`);
    const c = cv.getContext('2d');
    const host = $('result-scroll');
    host.replaceChildren(cv); host.scrollTop = 0;

    c.fillStyle = '#3f0f0b'; c.fillRect(0, 0, W, cv.height);
    c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    c.fillStyle = '#e0b24a'; c.font = `104px ${DISPLAY}`;
    c.fillText('急急如律令', W / 2, 120);
    c.fillStyle = '#fff6dc'; c.font = `700 40px ${BODY}`;
    c.fillText(`一炷香 ${n} 張符・香油錢 ${fmtMoney(money)}`, W / 2, 182);
    c.fillStyle = '#f3d98f'; c.font = `700 38px ${BODY}`;
    c.fillText(`稱號：${rankOf(n)}`, W / 2, 234);
    const col = collapse(records);
    c.fillStyle = '#fff6dc'; c.font = `32px ${BODY}`;
    c.fillText((col.index === null ? '' : `手速崩壞指數 ${col.index}%　`) + col.line, W / 2, 288, W - pad * 2);

    const paper = document.createElement('canvas');
    paper.width = cw; paper.height = ch;
    drawPaperBase(paper.getContext('2d'), cw, ch);

    const drawCell = i => {
      const r = records[i];
      const x = pad + (i % cols) * (cw + gap);
      const y = headH + Math.floor(i / cols) * (ch + capH + gap);
      c.drawImage(paper, x, y);
      c.drawImage(r.snapshot, x, y, cw, ch);
      drawStamp(c, x + cw * .7, y + ch * .78, cw * .22);
      const fs = Math.round(cw * .115), av = capH * .86;
      const face = makePersonCanvas(r.cust.look, r.met === false ? 'sad' : 'happy');
      c.save();
      c.beginPath(); c.arc(x + av / 2, y + ch + capH / 2 + 2, av / 2, 0, Math.PI * 2); c.clip();
      c.fillStyle = '#6e1a12'; c.fillRect(x, y + ch, av, capH + 4);
      c.drawImage(face, 30, 28, 180, 180, x, y + ch + capH / 2 + 2 - av / 2, av, av);
      c.restore();
      c.fillStyle = r.met === true ? '#f3d98f' : '#fff6dc';
      c.font = `700 ${fs}px ${BODY}`;
      c.textAlign = 'left'; c.textBaseline = 'middle';
      const tx = x + av + cw * .03;
      const lines = wrapLines(c, r.cust.wish, cw - av - cw * .03, 2);
      const sub = r.met === true ? '靈驗' : r.met === false ? '不靈' : '';
      if (sub) lines.push(sub);
      const lh = fs * 1.2, y0 = y + ch + capH / 2 + 2 - (lines.length - 1) * lh / 2;
      lines.forEach((l, j) => {
        if (sub && j === lines.length - 1) { c.fillStyle = r.met ? '#f3d98f' : '#f6c0ad'; c.font = `${fs * .8}px ${BODY}`; }
        c.fillText(l, tx, y0 + j * lh);
      });
      c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    };

    c.fillStyle = '#f3d98f'; c.font = `26px ${BODY}`; c.textAlign = 'center';
    c.fillText('本壇符咒僅供娛樂，考試還是要讀書。', W / 2, cv.height - 34);

    let next = 0;
    const done = () => {
      if (myRound !== round) return;
      cv.toBlob(blob => {
        if (myRound !== round || !blob) return;
        resultBlob = blob;
        const img = new Image();
        img.alt = `今日符咒一覽，共 ${n} 張，香油錢 ${fmtMoney(money)}`;
        img.onload = () => { if (myRound === round) host.replaceChildren(img); };
        img.src = URL.createObjectURL(blob);
        ['again', 'save', 'copy'].forEach(id => { $(id).disabled = false; });
        $('again').focus({preventScroll:true});
      }, 'image/png');
    };
    const reveal = () => {
      if (myRound !== round) return;
      if (next < n) {
        drawCell(next++);
        if (next % 2) sfx.stamp();
        if (reduceMotion) reveal(); else later(reveal, 90);
      } else done();
    };
    reveal();
  }

  /* 按鈕 */
  $('start').addEventListener('click', start);
  $('again').addEventListener('click', start);
  $('sound').addEventListener('click', () => {
    soundOn = !soundOn;
    $('sound').setAttribute('aria-pressed', String(soundOn));
    $('sound-label').textContent = soundOn ? '開' : '關';
    ensureAudio();
    if (soundOn) sfx.knock(); else sfx.brush(0);
  });
  $('copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(shareText());
      $('status').textContent = '戰績已複製。';
    } catch {
      $('status').textContent = shareText();
    }
  });
  let downloads = null;
  (async () => {
    try { downloads = window.claude?.use ? await window.claude.use('downloads') : null; } catch { downloads = null; }
    if (downloads) { $('save').hidden = false; $('save-hint').hidden = true; }
  })();
  $('save').addEventListener('click', async () => {
    if (!downloads || !resultBlob) return;
    try {
      await downloads.save({filename:`急急如律令-${count}張.png`, data:resultBlob});
      $('status').textContent = '圖片已存好。';
    } catch (err) {
      if (err?.code === 'declined') return;
      $('status').textContent = err?.code === 'rate_limited' ? '存檔視窗已經開著，請先處理它。' : '這裡無法存圖，可以長按或右鍵存圖片。';
    }
  });

  /* 防止手機瀏覽器把畫符當成捲動或縮放 */
  for (const type of ['gesturestart', 'gesturechange', 'gestureend']) {
    document.addEventListener(type, e => { if (e.cancelable) e.preventDefault(); }, {passive:false});
  }
  game.addEventListener('touchmove', e => {
    if (state !== 'result' && e.cancelable) e.preventDefault();
  }, {passive:false});
  game.addEventListener('contextmenu', e => { if (state !== 'result') e.preventDefault(); });

  /* 開場畫面 */
  order = buildOrder();
  fillQueue();
  paintStatics();
  setBurn(1);
  showBest();
  setBubble('廟公', '師父，香快點好了，大家都在等你畫符。', '看願望 → 在黃紙上畫符 → 往上滑交符');
  if (document.fonts?.ready) document.fonts.ready.then(paintStatics);
  if (document.fonts?.load) {
    Promise.all([
      document.fonts.load(`92px "Cactus Classical Serif"`, '急如律令敕有求必應'),
      document.fonts.load(`700 32px "LXGW WenKai TC"`, '急如律令稱號香油錢')
    ]).then(paintStatics).catch(() => {});
  }
})();
</script>
</body></html>
